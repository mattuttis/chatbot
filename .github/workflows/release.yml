name: Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

# Runs one at a time, so two merges can't race on the tag commit.
concurrency: release

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      # GITHUB_TOKEN can't go on the branch rule's exception list, so the tag commit uses a deploy key.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Work out the image tag
        id: tag
        working-directory: backend
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "tag=${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatbot-backend:${{ steps.tag.outputs.tag }}

      - name: Commit the new tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG)' deploy/envs/test/values.yaml
          if git diff --quiet; then
            echo "Tag unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy chatbot-backend $TAG to test"
          git pull --rebase
          git push
