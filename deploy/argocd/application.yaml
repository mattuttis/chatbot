apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatbot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mattuttis/chatbot.git
    targetRevision: release/test
    path: deploy/chart
    helm:
      valueFiles:
        - ../envs/test/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: chatbot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
