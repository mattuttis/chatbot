name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      review: ${{ steps.filter.outputs.review }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            review:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.github/**'

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B verify

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  claude-review:
    needs: changes
    # PRs from forks can't read repo secrets.
    if: needs.changes.outputs.review == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      critical-issues: ${{ steps.verdict.outputs.critical-issues }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Lets the review run again after a claude-fix commit.
          allowed_bots: claude,github-actions
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The repo holds a Spring Boot backend, an Angular frontend and deployment config.

            Read the diff with `gh pr diff`. Focus on bugs, security issues, performance,
            framework best practices and missing tests. Post concise findings as inline
            comments, then post a short summary with `gh pr comment`.

            Set critical_issues to true only for problems that must not reach main, such
            as a leaked secret, a security hole, data loss or code that can't work.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"critical_issues":{"type":"boolean"}},"required":["critical_issues"]}'

      - name: Fail on critical issues
        id: verdict
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          CRITICAL=$(echo "$RESULT" | jq -r '.critical_issues')
          echo "critical-issues=$CRITICAL" >> "$GITHUB_OUTPUT"
          test "$CRITICAL" = "false"

  # One attempt per PR: the claude-fix label stops a second one.
  claude-fix:
    needs: claude-review
    if: always() && needs.claude-review.outputs.critical-issues == 'true' && !contains(github.event.pull_request.labels.*.name, 'claude-fix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Mark the fix attempt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label claude-fix

      # Uses the Claude GitHub App's token, because commits pushed with GITHUB_TOKEN don't start CI.
      - name: Claude fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The review of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}
            found critical issues. Read its comments with `gh pr view --comments` and fix only those
            critical issues, with the smallest change that works. Don't change anything under .github/.

            Commit the fix and push it to the branch ${{ github.head_ref }}. Then post a short summary
            of what you changed with `gh pr comment`. If you can't fix an issue safely, change nothing
            and say so in a comment.
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

  claude-fix-stopped:
    needs: claude-review
    if: always() && needs.claude-review.outputs.critical-issues == 'true' && contains(github.event.pull_request.labels.*.name, 'claude-fix')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Ask for help
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body "Claude has already tried to fix this PR and critical issues remain. Please fix them by hand."

  all-checks-passed:
    needs: [changes, backend-build, frontend-build, claude-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = "false"
