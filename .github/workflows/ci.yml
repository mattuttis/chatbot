name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      review: ${{ steps.filter.outputs.review }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            review:
              - 'backend/**'
              - 'frontend/**'
              - '.github/**'

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B verify

  claude-review:
    needs: changes
    # PRs from forks can't read repo secrets.
    if: needs.changes.outputs.review == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The repo holds a Spring Boot backend, an Angular frontend and deployment config.

            Read the diff with `gh pr diff`. Focus on bugs, security issues, performance,
            framework best practices and missing tests. Post concise findings as inline
            comments, then post a short summary with `gh pr comment`.

            Set critical_issues to true only for problems that must not reach main, such
            as a leaked secret, a security hole, data loss or code that can't work.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"critical_issues":{"type":"boolean"}},"required":["critical_issues"]}'

      - name: Fail on critical issues
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: echo "$RESULT" | jq -e '.critical_issues == false'

  all-checks-passed:
    needs: [changes, backend-build, claude-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = "false"
