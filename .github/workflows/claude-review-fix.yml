name: Claude review fix

# A human review whose overall comment mentions @claude asks Claude to fix the comments in it.
# "Request changes" isn't required, because GitHub doesn't offer it on your own PRs.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  fix:
    # Only reviews from people with write access, never from bots, and not on fork PRs (no secrets there).
    if: >-
      contains(github.event.review.body, '@claude') &&
      github.event.review.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One fix per PR at a time; a newer review waits for the running one.
    concurrency:
      group: claude-review-fix-${{ github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # A queued run may start after an earlier one pushed, so compare against what this run checked out.
      - name: Remember the starting commit
        id: start
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Claude writes its per-comment replies here; git must never commit it.
          echo ".claude-replies.json" >> .git/info/exclude

      - name: Collect the review comments
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
        # A random delimiter, so review text can't end the output early.
        run: |
          DELIM="EOF_$(uuidgen)"
          {
            echo "comments<<$DELIM"
            echo "Overall comment: ${REVIEW_BODY:-(none)}"
            gh api "repos/$REPO/pulls/$NUMBER/reviews/$REVIEW_ID/comments" --paginate \
              --jq '.[] | "\n- [id \(.id)] \(.path) line \(.line // .original_line): \(.body)"'
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Uses the Claude GitHub App's token, because commits pushed with GITHUB_TOKEN don't start CI.
      - name: Claude fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A reviewer requested changes on pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. These are their comments:

            ${{ steps.review.outputs.comments }}

            Address each comment with the smallest change that works. Don't change anything under .github/.
            Commit the changes and push them with exactly `git push origin HEAD:${{ github.head_ref }}`.
            If a comment is unclear or you can't address it safely, leave it.

            Then write `.claude-replies.json` in the repo root with one entry per comment that has an id:
            [{"id": <comment id>, "fixed": true or false, "body": "<one or two sentences: what you changed, or why not>"}]
            A later step posts these as replies in each thread. Finally post a short overall summary with `gh pr comment`.
          # Push is limited to the PR branch, without force.
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push origin HEAD:${{ github.head_ref }}),Bash(git status:*),Bash(git diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      # Replies in each comment's thread, and resolves the threads Claude fixed.
      - name: Reply to the review comments
        if: ${{ !cancelled() && hashFiles('.claude-replies.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch -q origin "$HEAD_REF"
          SHA=$(git rev-parse --short FETCH_HEAD)

          # Maps each comment id to its thread id, for resolving.
          THREADS=$(gh api graphql -F owner="$OWNER" -F name="$NAME" -F number="$NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) { nodes { id comments(first: 1) { nodes { databaseId } } } }
                }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | {key: (.comments.nodes[0].databaseId | tostring), value: .id}] | from_entries')

          jq -c '.[]' .claude-replies.json | while read -r reply; do
            ID=$(jq -r '.id' <<< "$reply")
            FIXED=$(jq -r '.fixed' <<< "$reply")
            BODY=$(jq -r '.body' <<< "$reply")
            if [ "$FIXED" = "true" ]; then BODY="Fixed in $SHA: $BODY"; else BODY="Not changed: $BODY"; fi

            gh api "repos/$REPO/pulls/$NUMBER/comments/$ID/replies" -f body="$BODY" > /dev/null

            THREAD=$(jq -r --arg id "$ID" '.[$id] // empty' <<< "$THREADS")
            if [ "$FIXED" = "true" ] && [ -n "$THREAD" ]; then
              gh api graphql -f threadId="$THREAD" -f query='
                mutation($threadId: ID!) { resolveReviewThread(input: {threadId: $threadId}) { thread { id } } }' > /dev/null
            fi
          done

      # The action can succeed without pushing anything, for example after a denied tool.
      - name: Check that a fix was pushed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
          START_SHA: ${{ steps.start.outputs.sha }}
        run: |
          git fetch -q origin "$HEAD_REF"
          if [ "$(git rev-parse FETCH_HEAD)" = "$START_SHA" ]; then
            gh pr comment "$PR_URL" --body "Claude didn't push any changes for this review. Please check its comment or fix it by hand."
            exit 1
          fi

      - name: Post the outcome to Slack
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          PR="<$PR_URL|PR #$NUMBER>"
          if [ "$STATUS" = "success" ]; then
            TEXT="🔧 Claude addressed your review on $PR. Click Approve and run"
          else
            TEXT="🛑 Claude couldn't address your review on $PR"
          fi

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
