backend:
  image:
    repository: ghcr.io/mattuttis/chatbot-backend
    tag: ""
  replicas: 1
  apiKeySecret: chatbot-claude

frontend:
  image:
    repository: ghcr.io/mattuttis/chatbot-frontend
    tag: ""
  replicas: 1

ingress:
  # Only this hostname reaches the app, so unknown preview names get a 404. A preview sets its own.
  # Empty would answer on any hostname.
  host: localhost

namespace:
  # On for previews, so deleting the preview also deletes its namespace.
  create: false
