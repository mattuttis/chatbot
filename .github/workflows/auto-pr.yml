name: Auto PR

on:
  push:
    branches: ['claude/slack-session-*', 'claude/issue-*']

permissions:
  contents: read

jobs:
  open-pr:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      # Uses a personal token, because PRs opened with GITHUB_TOKEN don't start CI.
      - name: Open a PR for the branch
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          OPEN=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq length)
          if [ "$OPEN" != "0" ]; then echo "PR already open"; exit 0; fi

          # Issue branches close their issue on merge.
          if [[ "$BRANCH" =~ ^claude/issue-([0-9]+)$ ]]; then
            BODY="Opened automatically for Claude's work on #${BASH_REMATCH[1]}.

          Closes #${BASH_REMATCH[1]}"
          else
            BODY="Opened automatically for Claude's Slack session."
          fi

          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "${MESSAGE%%$'\n'*}" --body "$BODY"
