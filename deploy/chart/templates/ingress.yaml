apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot
  annotations:
    # Without this, nginx holds back the reply instead of streaming it.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chatbot-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatbot-frontend
                port:
                  number: 8080
