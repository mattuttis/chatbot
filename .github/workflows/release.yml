name: Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/chart/**'

# Runs one at a time, so two merges can't race on the release branch.
concurrency: release

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Work out the backend tag
        id: backend
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "tag=${VERSION%-SNAPSHOT}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        if: steps.changes.outputs.backend == 'true'
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/chatbot-backend:${{ steps.backend.outputs.tag }}

      - name: Work out the frontend tag
        id: frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          VERSION=$(jq -r .version package.json)
          echo "tag=${VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        if: steps.changes.outputs.frontend == 'true'
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/chatbot-frontend:${{ steps.frontend.outputs.tag }}

      # Argo CD watches release/test, so the chart and tags must land there in one commit.
      - name: Update the release branch
        env:
          BACKEND_TAG: ${{ steps.backend.outputs.tag }}
          FRONTEND_TAG: ${{ steps.frontend.outputs.tag }}
        run: |
          git fetch --depth=1 origin release/test:release/test
          git switch release/test
          git rm -r -q deploy/chart
          git checkout "$GITHUB_SHA" -- deploy/chart
          FILE=deploy/envs/test/values.yaml
          [ -z "$BACKEND_TAG" ] || yq -i '.backend.image.tag = strenv(BACKEND_TAG)' "$FILE"
          [ -z "$FRONTEND_TAG" ] || yq -i '.frontend.image.tag = strenv(FRONTEND_TAG)' "$FILE"
          git add -A deploy
          if git diff --cached --quiet; then
            echo "Nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy chatbot ${GITHUB_SHA::7} to test"
          git push origin release/test
