<title>Spring AI Chatbot Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: a single column of two wide figures, runtime first, then delivery. */
  :root {
    --bg: #f2f5f8;
    --fg: #15232e;
    --muted: #4f6272;
    --zone: #e3eaf0;
    --box: #ffffff;
    --line: #9fb0be;
    --accent: #0f5cc0;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10181f;
      --fg: #e6edf3;
      --muted: #9db0bf;
      --zone: #18232c;
      --box: #223039;
      --line: #4d6272;
      --accent: #7db4ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10181f;
    --fg: #e6edf3;
    --muted: #9db0bf;
    --zone: #18232c;
    --box: #223039;
    --line: #4d6272;
    --accent: #7db4ff;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
  }
  main {
    max-width: 1040px;
    margin: 0 auto;
    display: grid;
    gap: 48px;
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: grid; gap: 8px; }
  h1 { margin: 0; font-size: 2rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
  h2 { margin: 0; font-size: 1.25rem; line-height: 1.3; font-weight: 600; text-wrap: balance; }
  header p { margin: 0; max-width: 65ch; color: var(--muted); }
  section { display: grid; gap: 12px; min-width: 0; }
  figure { margin: 0; display: grid; gap: 12px; min-width: 0; }
  .scroll { overflow-x: auto; min-width: 0; }
  svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--fg); }
  figcaption { max-width: 70ch; color: var(--muted); }

  .zone { fill: var(--zone); }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1; }
  .edge { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .reply { stroke-dasharray: 6 5; }
  .pull { fill: none; stroke: var(--accent); stroke-width: 2; }
  .zone-label { fill: var(--muted); font: 500 11px var(--font-mono); letter-spacing: 0.08em; }
  .title { fill: var(--fg); font: 600 13px var(--font-body); text-anchor: middle; }
  .sub { fill: var(--muted); font: 400 11px var(--font-mono); text-anchor: middle; }
  .sub.key { fill: var(--accent); font-weight: 500; }
  .label { fill: var(--fg); font: 400 12px var(--font-mono); text-anchor: middle; }
  .label.left { text-anchor: start; }
  .label.pull-label { fill: var(--accent); font-weight: 500; }
  .note { fill: var(--muted); font: 400 11px var(--font-mono); text-anchor: middle; }
</style>

<main>
  <header>
    <h1>Spring AI Chatbot Architecture</h1>
    <p>How a chat message travels at runtime, and how a change requested in Slack reaches a PR preview and the local cluster.</p>
  </header>

  <section>
    <h2>A chat message at runtime</h2>
    <figure>
      <div class="scroll">
        <svg viewBox="0 0 960 336" role="img" aria-label="The Angular UI in the browser sends a chat message through the Minikube Ingress to the Spring Boot backend, which alone holds the Claude API key, calls the Claude API, and streams the reply back to the browser.">
          <defs>
            <marker id="rt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
            </marker>
          </defs>

          <rect class="zone" x="16" y="16" width="164" height="304" rx="10"/>
          <rect class="zone" x="268" y="16" width="444" height="304" rx="10"/>
          <rect class="zone" x="788" y="16" width="156" height="304" rx="10"/>
          <text class="zone-label" x="30" y="38">YOUR BROWSER</text>
          <text class="zone-label" x="288" y="38">MINIKUBE CLUSTER</text>
          <text class="zone-label" x="804" y="38">ANTHROPIC</text>

          <rect class="box" x="30" y="150" width="136" height="64" rx="6"/>
          <text class="title" x="98" y="178">Angular chat UI</text>
          <text class="sub" x="98" y="194">no API key</text>

          <rect class="box" x="288" y="142" width="110" height="80" rx="6"/>
          <text class="title" x="343" y="178">Ingress</text>
          <text class="sub" x="343" y="194">path routing</text>

          <rect class="box" x="486" y="70" width="210" height="64" rx="6"/>
          <text class="title" x="591" y="98">Frontend</text>
          <text class="sub" x="591" y="114">nginx, Angular static files</text>

          <rect class="box" x="486" y="210" width="210" height="72" rx="6"/>
          <text class="title" x="591" y="242">Spring Boot backend</text>
          <text class="sub key" x="591" y="258">Spring AI, holds API key</text>

          <rect class="box" x="804" y="210" width="132" height="72" rx="6"/>
          <text class="title" x="870" y="250">Claude API</text>

          <path class="edge" d="M166 166 H288" marker-end="url(#rt-arrow)"/>
          <text class="label" x="224" y="159">chat message</text>
          <path class="edge reply" d="M288 198 H166" marker-end="url(#rt-arrow)"/>
          <text class="label" x="224" y="215">SSE reply</text>

          <path class="edge" d="M398 162 H442 V102 H486" marker-end="url(#rt-arrow)"/>
          <text class="label" x="464" y="95">/</text>
          <path class="edge" d="M398 190 H442 V232 H486" marker-end="url(#rt-arrow)"/>
          <text class="label" x="464" y="225">/api</text>
          <path class="edge reply" d="M486 264 H343 V222" marker-end="url(#rt-arrow)"/>
          <text class="label" x="414" y="281">streamed reply</text>

          <path class="edge" d="M696 232 H804" marker-end="url(#rt-arrow)"/>
          <text class="label" x="750" y="225">prompt</text>
          <path class="edge reply" d="M804 264 H696" marker-end="url(#rt-arrow)"/>
          <text class="label" x="750" y="281">stream</text>
        </svg>
      </div>
      <figcaption>Only the backend talks to Claude, so the API key never reaches the browser. The Ingress serves both the UI and the API from one origin, which avoids CORS. Dashed lines show the reply streaming back word by word.</figcaption>
    </figure>
  </section>

  <section>
    <h2>A code change reaching the cluster</h2>
    <figure>
      <div class="scroll">
        <svg viewBox="0 0 960 552" role="img" aria-label="A request to @Claude in Slack starts a Claude cloud session, which pushes a branch that opens a pull request. The PR runs build and Claude review checks. A passed review starts a preview job, and merging starts a release job. Both publish images and Git state, which Argo CD inside Minikube reads to deploy the previews and the test app, so every connection starts from inside the cluster.">
          <defs>
            <marker id="cd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/>
            </marker>
            <marker id="cd-arrow-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/>
            </marker>
          </defs>

          <rect class="zone" x="16" y="16" width="164" height="100" rx="10"/>
          <rect class="zone" x="244" y="16" width="200" height="100" rx="10"/>
          <rect class="zone" x="16" y="134" width="620" height="402" rx="10"/>
          <rect class="zone" x="716" y="272" width="228" height="264" rx="10"/>
          <text class="zone-label" x="32" y="36">SLACK</text>
          <text class="zone-label" x="260" y="36">ANTHROPIC CLOUD</text>
          <text class="zone-label" x="560" y="156">GITHUB</text>
          <text class="zone-label" x="736" y="294">MINIKUBE ON YOUR LAPTOP</text>

          <path class="pull" d="M740 60 H700" marker-end="url(#cd-arrow-pull)"/>
          <text class="label left pull-label" x="752" y="56">started from</text>
          <text class="label left pull-label" x="752" y="72">inside the cluster</text>
          <path class="edge" d="M740 106 H700" marker-end="url(#cd-arrow)"/>
          <text class="label left" x="752" y="110">pipeline step</text>

          <rect class="box" x="32" y="46" width="132" height="56" rx="6"/>
          <text class="title" x="98" y="70">@Claude request</text>
          <text class="sub" x="98" y="86">private channel</text>

          <rect class="box" x="260" y="46" width="168" height="56" rx="6"/>
          <text class="title" x="344" y="70">Claude session</text>
          <text class="sub" x="344" y="86">writes the change</text>

          <path class="edge" d="M164 74 H260" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M344 102 V168 H80 V198" marker-end="url(#cd-arrow)"/>
          <text class="label" x="212" y="160">branch opens a PR</text>

          <rect class="box" x="32" y="198" width="96" height="60" rx="6"/>
          <text class="title" x="80" y="233">Pull request</text>

          <rect class="box" x="166" y="174" width="130" height="50" rx="6"/>
          <text class="title" x="231" y="195">Build and test</text>
          <text class="sub" x="231" y="211">Maven, Angular</text>

          <rect class="box" x="166" y="236" width="130" height="50" rx="6"/>
          <text class="title" x="231" y="257">Claude review</text>
          <text class="sub" x="231" y="273">fails on critical</text>

          <rect class="box" x="336" y="198" width="136" height="60" rx="6"/>
          <text class="title" x="404" y="224">All checks passed</text>
          <text class="sub" x="404" y="240">then your review</text>

          <rect class="box" x="512" y="198" width="108" height="60" rx="6"/>
          <text class="title" x="566" y="233">Merge to main</text>

          <path class="edge" d="M128 228 H147 V199 H166" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M128 228 H147 V261 H166" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M296 199 H316 V228 H336" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M296 261 H316 V228 H336" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M472 228 H512" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M231 286 V330" marker-end="url(#cd-arrow)"/>
          <path class="edge" d="M566 258 V304 H96 V440 H120" marker-end="url(#cd-arrow)"/>

          <rect class="box" x="146" y="330" width="170" height="80" rx="6"/>
          <text class="title" x="231" y="360">Preview job</text>
          <text class="sub" x="231" y="376">after a passed review</text>
          <text class="sub" x="231" y="392">tag pr-24-3f2a9c1</text>

          <rect class="box" x="120" y="430" width="170" height="80" rx="6"/>
          <text class="title" x="205" y="460">Release job</text>
          <text class="sub" x="205" y="476">runs on merge</text>
          <text class="sub" x="205" y="492">tag 0.1.0-3f2a9c1</text>

          <rect class="box" x="456" y="330" width="164" height="180" rx="6"/>
          <text class="title" x="538" y="366">ghcr.io</text>
          <text class="sub" x="538" y="382">public images</text>
          <path class="edge" d="M472 420 H604" style="stroke:var(--line);stroke-width:1"/>
          <text class="title" x="538" y="452">Git</text>
          <text class="sub" x="538" y="468">release/test branch</text>
          <text class="sub" x="538" y="484">PR label: preview</text>

          <path class="edge" d="M316 370 H456" marker-end="url(#cd-arrow)"/>
          <text class="label" x="386" y="363">images, label</text>
          <path class="edge" d="M290 470 H456" marker-end="url(#cd-arrow)"/>
          <text class="label" x="373" y="463">images, chart, tags</text>

          <rect class="box" x="736" y="314" width="188" height="84" rx="6"/>
          <text class="title" x="830" y="342">Running pods</text>
          <text class="sub" x="830" y="360">chatbot: test app</text>
          <text class="sub" x="830" y="376">chatbot-pr-24: preview</text>

          <rect class="box" x="736" y="450" width="188" height="60" rx="6"/>
          <text class="title" x="830" y="476">Argo CD</text>
          <text class="sub" x="830" y="492">runs in the cluster</text>

          <path class="pull" d="M736 366 H620" marker-end="url(#cd-arrow-pull)"/>
          <text class="label pull-label" x="676" y="359">pull image</text>
          <path class="pull" d="M736 480 H620" marker-end="url(#cd-arrow-pull)"/>
          <text class="label pull-label" x="676" y="473">watch Git</text>

          <path class="edge" d="M830 450 V398" marker-end="url(#cd-arrow)"/>
          <text class="label left" x="838" y="428">apply chart</text>
        </svg>
      </div>
      <figcaption>Blue arrows show who starts each connection, and both start inside Minikube, so GitHub never has to reach your laptop. A passed review gives the PR its own preview, and a merge updates <code>release/test</code>. Rolling back means reverting that commit.</figcaption>
    </figure>
  </section>
</main>
